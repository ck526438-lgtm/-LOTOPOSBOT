name: Publier une version

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et compilation
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "LOTOPOSBOT-${GITHUB_REF_NAME}.apk"

      - uses: softprops/action-gh-release@v2
        with:
          name: LOTOPOSBOT ${{ github.ref_name }}
          body_path: docs/NOTES_VERSION.md
          files: LOTOPOSBOT-${{ github.ref_name }}.apk
