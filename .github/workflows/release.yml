name: Publier une version

on:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Tests et compilation
        run: ./gradlew --no-daemon testDebugUnitTest assembleDebug

      - name: Nommer l'APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "LOTOPOSBOT-${GITHUB_REF_NAME}.apk"

      - name: Attacher l'APK à la Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" "LOTOPOSBOT-${GITHUB_REF_NAME}.apk" --clobber
